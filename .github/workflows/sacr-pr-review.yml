name: sacr PR review

# Runs sacr on every PR to this repo and posts inline review comments.
# This is what a real consumer of sacr would look like.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sacr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (merge commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout product repo (sacr source)
        uses: actions/checkout@v4
        with:
          repository: shubam-disseqt/shubam-ai-code-reviewer
          path: .product
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .product/go.mod

      - name: Build sacr
        run: cd .product && go build -trimpath -o "$RUNNER_TEMP/sacr" ./cmd/sacr

      # sacr's deterministic scanners are best-effort: a missing binary is
      # skipped with a log line. Install all three so the scanner path is
      # actually exercised on this benchmark.
      - name: Install scanners (gitleaks, semgrep, govulncheck)
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          pipx install semgrep
          "$HOME/go/bin/gitleaks" version
          "$HOME/go/bin/govulncheck" -version
          semgrep --version

      - name: sacr review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SACR_MODEL: gpt-4o-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # sacr's --pr controls posting only; resolveDiffs falls back to
        # workspace mode (empty in CI) when --from/--to aren't set.
        # Pass base+head SHAs explicitly so the diff provider sees the PR.
        run: |
          "$RUNNER_TEMP/sacr" review \
            --pr ${{ github.event.pull_request.number }} \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --format github \
            --min-severity LOW

      # The session JSONL carries the exact prompt sacr sent (including the
      # "Codebase context" block from the index), which is the only way to
      # verify indexed context reached the model.
      - name: Upload sacr session + index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacr-session-pr${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ~/.sacr/sessions/
            ~/.sacr/index/
          retention-days: 14
          if-no-files-found: warn
