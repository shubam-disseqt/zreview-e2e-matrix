name: sacr E2E matrix

# Consolidated PR-mode E2E:
#  - Iterates case branches, reviews the persistent PR for each with
#    sacr in --format github (posts inline comments) AND --format json
#    (captures findings for assertion).
#  - Asserts each case against .matrix/expected.json.
#  - Aggregates recall + gates.
#
# The runner (this workflow) lives on the matrix repo so the product
# repo (shubam-ai-code-reviewer) stays a pure product — other repos
# consume the sacr Action; only this repo owns the E2E audit surface.

on:
  schedule:
    # Nightly 03:00 UTC — catches recall drift from prompt / model / provider drift.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      min_recall:
        description: "Gate threshold on aggregate hard recall (0.0-1.0)"
        required: false
        default: "0.8"

permissions:
  contents: read
  pull-requests: write   # sacr --format github posts inline comments

concurrency:
  # One matrix run at a time — LLM rate limit + persistent PRs mean
  # cases can't safely race.
  group: e2e-matrix
  cancel-in-progress: false

env:
  # Persistent open PRs on this repo, one per case archetype. Each PR's
  # head branch has .matrix/expected.json as ground truth. PR numbers are
  # discovered at runtime via `gh pr list --head <branch>` so this list
  # only needs the branch names.
  CASES: '["pr-1-branch","pr-3-branch","pr-5-branch","pr-10-branch"]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.set.outputs.cases }}
      min_recall: ${{ steps.set.outputs.min_recall }}
    steps:
      - id: set
        run: |
          echo "cases=$CASES" >> "$GITHUB_OUTPUT"
          echo "min_recall=${{ inputs.min_recall || '0.8' }}" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.plan.outputs.cases) }}
    steps:
      - name: Checkout matrix at case branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.case }}
          fetch-depth: 0
          path: matrix

      - name: Checkout product repo (to build sacr from source)
        uses: actions/checkout@v4
        with:
          repository: shubam-disseqt/shubam-ai-code-reviewer
          token: ${{ secrets.PRODUCT_REPO_TOKEN }}
          path: product
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: product/go.mod

      - name: Build sacr + assert
        run: |
          cd product && go build -trimpath -o "$RUNNER_TEMP/sacr" ./cmd/sacr
          cd ../matrix && go build -o "$RUNNER_TEMP/assert" ./../matrix/.e2e/assert

      - name: Resolve PR number for case
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "${{ matrix.case }}" \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -z "$num" ] || [ "$num" = "null" ]; then
            echo "::error::no open PR with head ${{ matrix.case }}"
            exit 1
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "case ${{ matrix.case }} → PR #$num"

      - name: sacr review — post to PR (PR mode)
        working-directory: matrix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SACR_MODEL: gpt-4o-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          "$RUNNER_TEMP/sacr" review \
            --pr "${{ steps.pr.outputs.num }}" \
            --format github \
            --min-severity LOW \
            --repo .

      - name: sacr review — capture JSON for assertion
        working-directory: matrix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SACR_MODEL: gpt-4o-mini
        run: |
          "$RUNNER_TEMP/sacr" review \
            --commit HEAD \
            --format json \
            --min-severity LOW \
            --output "$RUNNER_TEMP/actual.json" \
            --repo .

      - name: Assert
        working-directory: matrix
        run: |
          "$RUNNER_TEMP/assert" \
            -expected .matrix/expected.json \
            -actual "$RUNNER_TEMP/actual.json" \
            -case "${{ matrix.case }}" \
            -json > "$RUNNER_TEMP/result.json" || true
          cat "$RUNNER_TEMP/result.json"

      - name: Upload per-case artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-case-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/actual.json
            ${{ runner.temp }}/result.json
          retention-days: 30

  report:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout matrix (main) for aggregate tool
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .e2e/go.mod

      - name: Build aggregate
        working-directory: .e2e
        run: go build -o "$RUNNER_TEMP/aggregate" ./aggregate

      - name: Download all case artifacts
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: e2e-case-*

      - name: Aggregate
        id: agg
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          RESULT_FILES=()
          for d in results/e2e-case-*/; do
            if [ -f "${d}result.json" ]; then
              RESULT_FILES+=("${d}result.json")
            fi
          done
          if [ "${#RESULT_FILES[@]}" -eq 0 ]; then
            echo "::warning::no per-case results downloaded"
          fi
          "$RUNNER_TEMP/aggregate" \
            -min-recall "${{ needs.plan.outputs.min_recall }}" \
            -summary "$RUNNER_TEMP/summary.json" \
            -markdown "$RUNNER_TEMP/report.md" \
            "${RESULT_FILES[@]}" || AGG_EXIT=$?
          echo "===== SUMMARY ====="
          cat "$RUNNER_TEMP/summary.json"
          echo "===== REPORT ====="
          cat "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "exit=${AGG_EXIT:-0}" >> "$GITHUB_OUTPUT"

      - name: Upload aggregated report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-matrix-report
          path: |
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/report.md
          retention-days: 90

      - name: Gate
        run: |
          if [ "${{ steps.agg.outputs.exit }}" != "0" ]; then
            echo "::error::E2E matrix failed the recall gate — see summary above"
            exit 1
          fi
