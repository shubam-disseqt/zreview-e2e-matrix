name: sacr review

# Triggered by the product-repo E2E matrix workflow via `gh workflow run`,
# targeting one of the persistent case PRs. Also runs on real pull_request
# events so a human opening a PR here gets the same sacr treatment.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write   # sacr posts inline comments + updates PR body

concurrency:
  group: sacr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: echo "num=${{ github.event.pull_request.number || inputs.pr }}" >> "$GITHUB_OUTPUT"

      - name: Checkout matrix (PR head)
        uses: actions/checkout@v4
        with:
          # Fetch the merge commit for the PR under review.
          ref: refs/pull/${{ steps.pr.outputs.num }}/head
          fetch-depth: 0
          path: matrix

      - name: Checkout product repo (build sacr from source until v0.2.0 ships)
        uses: actions/checkout@v4
        with:
          repository: shubam-disseqt/shubam-ai-code-reviewer
          token: ${{ secrets.PRODUCT_REPO_TOKEN }}
          path: product
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: product/go.mod

      - name: Build sacr
        working-directory: product
        run: go build -trimpath -o "$RUNNER_TEMP/sacr" ./cmd/sacr

      - name: Post inline comments to PR
        working-directory: matrix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SACR_MODEL: gpt-4o-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          "$RUNNER_TEMP/sacr" review \
            --pr "${{ steps.pr.outputs.num }}" \
            --format github \
            --min-severity LOW \
            --repo .

      - name: Capture same review as JSON (for E2E assertion)
        working-directory: matrix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SACR_MODEL: gpt-4o-mini
        run: |
          "$RUNNER_TEMP/sacr" review \
            --commit HEAD \
            --format json \
            --min-severity LOW \
            --output "$RUNNER_TEMP/result.json" \
            --repo .

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacr-review-pr-${{ steps.pr.outputs.num }}
          path: |
            ${{ runner.temp }}/result.json
          retention-days: 30
